name: linux-stream-debug

# Linux streaming CI — mirrors mac-stream.yml but uses the faster-whisper backend.
# Runs on ubuntu-latest (x86-64 CPU, no Metal/Apple Silicon).
#
# Pipeline:
#   1. Install faster-whisper + audio deps (no MLX, no torch at runtime)
#   2. Pull models: faster-distil-whisper-small.en  +  zero-stt-hinglish-ct2
#   3. Warmup: assert all 3 engines load (fast, hinglish, detect)
#   4. Offline proof: block_network() then run all 6 samples
#   5. Per-clip debug table -> debug_table_linux.txt
#   6. Streaming scorecard  -> streaming_score_linux.txt
#
# Required secret: HF_TOKEN (read access to sanke/zero-stt-hinglish-ct2)
# Run convert-zero-stt.yml first if you haven't uploaded the converted model yet.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "solution/**"
      - "scripts/debug_stream.py"
      - "scripts/offline_check.py"
      - ".github/workflows/linux-stream.yml"

jobs:
  linux-stream-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      # faster-whisper model IDs — override here to pin specific versions.
      # FW_ENGLISH_MODEL  uses the pre-built Systran CT2 repo (no conversion needed).
      # FW_HINGLISH_MODEL must point to the CT2 repo you produced with convert-zero-stt.yml.
      FW_ENGLISH_MODEL:  "Systran/faster-distil-whisper-small.en"
      FW_HINGLISH_MODEL: "sanke/zero-stt-hinglish-ct2"
      FW_DETECT_MODEL:   "Systran/faster-whisper-tiny"
      HF_HUB_DISABLE_XET: "1"

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── Cache HF model hub to avoid re-downloading on every push ─────────
      - name: Cache HF models (faster-whisper CT2)
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-linux-fw-${{ env.FW_ENGLISH_MODEL }}-${{ env.FW_HINGLISH_MODEL }}-${{ env.FW_DETECT_MODEL }}
          restore-keys: hf-linux-fw-

      # ── Install runtime deps (no torch, no MLX) ───────────────────────────
      - name: Install Python deps
        run: |
          pip install --quiet \
            faster-whisper \
            soundfile \
            websockets \
            numpy \
            huggingface_hub

      # ── Step 1: Warmup — pull + initialise all models ─────────────────────
      - name: Warmup — pull + JIT all models (network allowed)
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          python - <<'EOF'
          import os
          # Temporarily unset offline guard so warm_all() can pull from HF
          os.environ.pop("HF_HUB_OFFLINE", None)
          # Pass HF_TOKEN so private CT2 repos can be downloaded
          from solution import engines
          status = engines.warm_all()
          print("warmup status:", status)
          failed = [k for k, v in status.items() if not v]
          if failed:
              raise SystemExit(f"engines failed to load: {failed}")
          print("all engines warm and ready")
          EOF

      # ── Step 2: Offline proof ─────────────────────────────────────────────
      - name: Offline proof — block_network() then run all 6 samples
        run: python scripts/offline_check.py

      # ── Step 3: Per-clip debug table ──────────────────────────────────────
      - name: Per-clip debug (lane / raw / final / gold / scores / timings)
        run: |
          python scripts/debug_stream.py samples/manifest.json | tee debug_table_linux.txt

      # ── Step 4: Official streaming scorecard ─────────────────────────────
      - name: Streaming scorecard (preview_stream.py)
        run: python preview_stream.py | tee streaming_score_linux.txt

      # ── Upload logs ───────────────────────────────────────────────────────
      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-stream-debug-logs
          path: |
            debug_table_linux.txt
            streaming_score_linux.txt
